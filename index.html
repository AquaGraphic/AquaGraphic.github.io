<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aqua — Graphic designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,800&family=Manrope:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="aura" aria-hidden="true"></div>

  <nav class="glass" aria-label="Main">
    <span class="brand">Aqua</span>
    <span class="sub">Graphic designer</span>
    <a class="nav-cta" id="wa-nav" href="#" target="_blank" rel="noopener">Start your brand</a>
  </nav>

  <main>
    <section class="hero" aria-label="About">
      <div class="bio glass">
        <div class="avatar">
          <img src="images/profile.jpg" alt="Aqua, graphic designer" width="1008" height="1012" />
        </div>
        <p>
          I'm Akram, or you can call me Aqua. I'm a medical student who loves
          to design. Scroll to view my portfolio, Contact to make your brand
          distinctive.
        </p>
        <a class="btn" id="wa" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.3 1.3-1.9 1.4-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5-4.5-.1-.2-1.200-1.600-1.200-3s.8-2.100 1-2.400c.3-.3.600-.3.800-.3h.600c.2 0 .4 0 .6.500l.8 2c.1.1.1.300 0 .5l-.3.500-.4.500c-.1.100-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.100 1 2.100 1.300 2.400 1.500.3.100.5.100.6-.1l.9-1.100c.2-.3.400-.2.700-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.500Z" />
          </svg>
          Message me on WhatsApp
        </a>
      </div>
    </section>

    <div class="dot" aria-hidden="true"></div>

    <section id="work" aria-labelledby="work-title">
      <div class="head">
        <h2 id="work-title">Gallery</h2>
        <p>Here are my latest projects ordered from newest to oldest.</p>
      </div>
      <div id="cats"></div>
    </section>

    <div class="dot" aria-hidden="true"></div>
  </main>

  <footer>
    <div class="socials glass">
      <a id="li" href="#" target="_blank" rel="noopener" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.5h4V21H3V9.5Zm6.5 0h3.8v1.6h.1c.5-1 1.800-2 3.700-2 4 0 4.700 2.600 4.700 6V21h-4v-5.200c0-1.300 0-2.900-1.800-2.900s-2 1.400-2 2.800V21h-4V9.500Z" />
        </svg>
      </a>
      <a id="ig" href="#" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4.2" />
          <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none" />
        </svg>
      </a>
      <a id="be" href="#" target="_blank" rel="noopener" aria-label="Behance">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M8.2 11.2c1-.5 1.600-1.300 1.600-2.600C9.800 6.300 8.200 5.500 6 5.500H0v13h6.300c2.400 0 4.300-1.100 4.300-3.500 0-1.700-.9-2.800-2.400-3.300ZM3 7.800h2.700c1 0 1.700.4 1.700 1.400s-.7 1.500-1.800 1.500H3V7.800Zm2.900 8.400H3v-3.300h3c1.200 0 2 .5 2 1.600 0 1.200-1 1.700-2.100 1.700ZM15.500 8h5.500V6.700h-5.500V8Zm2.700 2.300c-2.900 0-4.600 1.900-4.600 4.600 0 2.800 1.700 4.500 4.700 4.500 2 0 3.400-.8 4-2.700h-2c-.2.500-.8.900-1.900.9-1.400 0-2.200-.7-2.300-2.100h6.500c.2-3.100-1.300-5.200-4.400-5.200Zm-2.100 3.700c.1-1.100.9-1.800 2.100-1.800 1.100 0 1.900.6 2 1.800h-4.100Z" />
        </svg>
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
